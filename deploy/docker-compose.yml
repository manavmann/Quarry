# Quarry demo cluster: one control plane + three Docker-executor runners.
#
#   docker compose -f deploy/docker-compose.yml build server runner-1  # once per image; see README
#   docker compose -f deploy/docker-compose.yml up -d --wait
#   QUARRY_TOKEN=dev-token quarry run --wait -C examples/go-app
#
# Default profile has no external dependencies: SQLite and the local
# artifact store live in the `quarry-data` named volume. Override the
# token with QUARRY_API_TOKEN in the environment or a deploy/.env file.
#
# The `remote` profile adds a replicated object-store cluster (one
# coordinator + three storage nodes, RF=3, W=2) and points the server's
# artifact store at it. Both the profile and the backend switch are needed:
#
#   COMPOSE_PROFILES=remote QUARRY_ARTIFACT_BACKEND=remote \
#     docker compose -f deploy/docker-compose.yml up -d --wait
#
# The coordinator is published on  so
# `QUARRY_TEST_REMOTE_URL=http://127.0.0.1:8090 make test-docker` runs the
# integration tests against it. QUARRY_STORAGE_IMAGE overrides the image
# (e.g. one built locally from the storage project's deploy/Dockerfile).
#
# The `prometheus` profile adds a Prometheus scraping the server and the
# three runners every 5 s (deploy/prometheus.yml), published on
# $QUARRY_PROMETHEUS_PORT (default 9090). No Grafana, no dashboards:
#
#   COMPOSE_PROFILES=prometheus docker compose -f deploy/docker-compose.yml up -d --wait

# Project name, so containers are quarry-* and a sibling `deploy/` directory
# in another checkout does not share the project.
name: quarry

x-storage-node: &storage-node
  image: ${QUARRY_STORAGE_IMAGE:-ghcr.io/manavmann/distributed-object-storage:latest}
  profiles: [remote]
  command: ["/storagenode"]
  restart: unless-stopped
  depends_on:
    storage-coordinator:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/storagenode", "-healthcheck"]
    interval: 2s
    timeout: 5s
    retries: 15
    start_period: 5s

x-runner: &runner
  build:
    context: ..
    dockerfile: deploy/runner.Dockerfile
    args: { VERSION: "${QUARRY_VERSION:-dev}" }
  image: quarry-runner:${QUARRY_VERSION:-dev}
  restart: unless-stopped
  environment: &runner-env
    QUARRY_SERVER: http://server:8080
    QUARRY_API_TOKEN: ${QUARRY_API_TOKEN:-dev-token}
    QUARRY_EXECUTOR: docker
    QUARRY_CAPACITY: "2"
    QUARRY_METRICS_LISTEN: ":9100"
  volumes:
    # Docker-out-of-Docker: job containers are siblings on the host daemon.
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    server:
      condition: service_healthy
  # Healthy once the runner has registered itself with the control plane.
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        wget -qO- --header "Authorization: Bearer $$QUARRY_API_TOKEN"
        http://server:8080/api/runners | grep -q "\"$$QUARRY_RUNNER_NAME\""
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s

services:
  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
      args: { VERSION: "${QUARRY_VERSION:-dev}" }
    image: quarry-server:${QUARRY_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${QUARRY_PORT:-8080}:8080"
    environment:
      QUARRY_API_TOKEN: ${QUARRY_API_TOKEN:-dev-token}
      QUARRY_LEASE_TTL: ${QUARRY_LEASE_TTL:-30s}
      # local by default; remote needs the `remote` profile's cluster. The
      # server cannot depends_on a profiled service, so with the remote
      # backend it retries the bucket ensure and, failing that, is
      # restarted until the coordinator is up.
      QUARRY_ARTIFACT_BACKEND: ${QUARRY_ARTIFACT_BACKEND:-local}
      QUARRY_ARTIFACT_REMOTE_URL: http://storage-coordinator:8080
      QUARRY_ARTIFACT_REMOTE_BUCKET: ${QUARRY_ARTIFACT_REMOTE_BUCKET:-quarry-artifacts}
    volumes:
      - quarry-data:/var/lib/quarry
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  runner-1:
    <<: *runner
    environment:
      <<: *runner-env
      QUARRY_RUNNER_NAME: runner-1
      QUARRY_LABELS: os=linux,pool=build

  runner-2:
    <<: *runner
    environment:
      <<: *runner-env
      QUARRY_RUNNER_NAME: runner-2
      QUARRY_LABELS: os=linux,pool=test

  runner-3:
    <<: *runner
    environment:
      <<: *runner-env
      QUARRY_RUNNER_NAME: runner-3
      QUARRY_LABELS: os=linux,pool=test

  # --- remote profile: replicated object store for artifacts ---

  storage-coordinator:
    image: ${QUARRY_STORAGE_IMAGE:-ghcr.io/manavmann/distributed-object-storage:latest}
    profiles: [remote]
    command: ["/coordinator"]
    restart: unless-stopped
    environment:
      CAIRN_ADDR: ":8080"
      CAIRN_DATA_DIR: /data
      CAIRN_REPLICATION_FACTOR: "3"
      CAIRN_WRITE_QUORUM: "2"
      CAIRN_HEARTBEAT_TIMEOUT: 3s
      CAIRN_REPAIR_INTERVAL: 2s
      CAIRN_REPAIR_GRACE: 10s
    ports:
      - "${QUARRY_STORAGE_PORT:-8090}:8080"
    volumes:
      - storage-coordinator-data:/data
    healthcheck:
      test: ["CMD", "/coordinator", "-healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  storage-node-1:
    <<: *storage-node
    environment:
      CAIRN_NODE_ID: node1
      CAIRN_ADDR: ":9000"
      CAIRN_ADVERTISE_ADDR: http://storage-node-1:9000
      CAIRN_COORDINATOR_URL: http://storage-coordinator:8080
      CAIRN_HEARTBEAT_INTERVAL: 1s
      CAIRN_DATA_DIR: /data
    volumes:
      - storage-node-1-data:/data

  storage-node-2:
    <<: *storage-node
    environment:
      CAIRN_NODE_ID: node2
      CAIRN_ADDR: ":9000"
      CAIRN_ADVERTISE_ADDR: http://storage-node-2:9000
      CAIRN_COORDINATOR_URL: http://storage-coordinator:8080
      CAIRN_HEARTBEAT_INTERVAL: 1s
      CAIRN_DATA_DIR: /data
    volumes:
      - storage-node-2-data:/data

  storage-node-3:
    <<: *storage-node
    environment:
      CAIRN_NODE_ID: node3
      CAIRN_ADDR: ":9000"
      CAIRN_ADVERTISE_ADDR: http://storage-node-3:9000
      CAIRN_COORDINATOR_URL: http://storage-coordinator:8080
      CAIRN_HEARTBEAT_INTERVAL: 1s
      CAIRN_DATA_DIR: /data
    volumes:
      - storage-node-3-data:/data

  # --- prometheus profile: scrapes the server and the runners ---

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [prometheus]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=1d"]
    ports:
      - "${QUARRY_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      server:
        condition: service_healthy

volumes:
  quarry-data:
  storage-coordinator-data:
  storage-node-1-data:
  storage-node-2-data:
  storage-node-3-data:
